name: Scrape UK Sources

on:
  schedule:
    - cron: "0 5 * * *"      # Daily at 05:00 UTC
  workflow_dispatch:           # Manual trigger

permissions:
  contents: write

concurrency:
  group: scrape-uk
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtual environment
        run: python3.11 -m venv .venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright if needed
        run: |
          source .venv/bin/activate
          JS_SOURCES=$(python3 - <<'PYEOF'
import glob, yaml
triggered = []
for path in sorted(glob.glob("src/config/sources*.yaml")):
    with open(path) as f:
        cfg = yaml.safe_load(f)
    for s in (cfg or {}).get("sources", []):
        if s.get("enabled") and s.get("requires_js"):
            triggered.append(s["name"])
print("\n".join(triggered))
PYEOF
)
          if [ -n "$JS_SOURCES" ]; then
            echo "Enabled JS sources requiring Playwright:"
            echo "$JS_SOURCES"
            playwright install chromium --with-deps
          else
            echo "No enabled JS sources, skipping Playwright"
          fi

      - name: Run scrapers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          source .venv/bin/activate
          python3 -m src.cli run --country uk

      - name: Commit results
        run: |
          git config user.name "Pol-Intel Bot"
          git config user.email "bot@orison.co"
          git add data/jobs.db feeds/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update UK feeds [skip ci]"
            git push origin main
          fi
