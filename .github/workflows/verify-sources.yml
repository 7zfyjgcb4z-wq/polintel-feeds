name: Verify Source Candidates

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Single candidate name to verify (leave blank to verify all)"
        required: false
        default: ""

# Explicitly NO schedule: block — this workflow must only run on manual dispatch.

permissions:
  contents: write

concurrency:
  group: verify-sources
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtual environment
        run: python3.11 -m venv .venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run verification harness
        run: |
          source .venv/bin/activate
          if [ -n "${{ github.event.inputs.candidate }}" ]; then
            python scripts/verify_sources.py --candidate "${{ github.event.inputs.candidate }}"
          else
            python scripts/verify_sources.py
          fi

      - name: Commit results
        run: |
          git config user.name "Pol-Intel Bot"
          git config user.email "bot@orison.co"
          git add verification/
          if git diff --staged --quiet; then
            echo "No verification results to commit"
          else
            git commit -m "chore(verify): run UK expansion verification harness [skip ci]"
            git push origin main
          fi
